# ══════════════════════════════════════════════════════════════════
# eduDS — Central Configuration
# ══════════════════════════════════════════════════════════════════
# Copy this file and adjust values for your environment.
# The Python pipeline reads this file at runtime.
# Do NOT commit secrets or personal paths — use .env for those.
# ══════════════════════════════════════════════════════════════════

# ── Paths ──────────────────────────────────────────────────────────
# Leave root_dir as null to auto-detect (repo root relative to src/).
# Set explicitly when running from a non-standard working directory,
# e.g. on HPC: root_dir: "/home/user/eduDS"
paths:
  root_dir: null
  docs_dir: "docs"
  query_dir: "docs/query"
  materials_md_dir: "docs/materials_md"
  results_dir: "results"
  vector_db_dir: "vector_db"
  log_dir: "log"

# ── Models ─────────────────────────────────────────────────────────
models:
  # HuggingFace sentence-transformer used for vector embeddings
  embedding_model: "BAAI/bge-large-en-v1.5"

  # Ollama model used for RAG / knowledge extraction
  # Override at runtime with --rag_model
  default_rag_model: "qwen2.5:7b"

  # Ollama model used for story/lesson generation
  # Override at runtime with --sy_model
  default_story_model: "qwen2.5:7b"

  # Full lists used by the experiment sweep scripts
  rag_models:
    - "deepseek-llm:7b"
    - "gemma:7b"
    - "qwen2.5:7b"
    - "openchat:7b"
    - "llama3.1:8b"
    - "olmo2:7b"
    - "phi4:14b"

  story_models:
    - "deepseek-llm:7b"
    - "gemma:7b"
    - "qwen2.5:7b"
    - "openchat:7b"
    - "llama3.1:8b"
    - "olmo2:7b"
    - "phi4:14b"

# ── Ollama server ──────────────────────────────────────────────────
ollama:
  host: "http://127.0.0.1"
  port: 11434
  context_size: 8192
  max_loaded_models: 4
  keep_loaded: true
  precision: "fp16"        # fp16 | fp32
  batch_size: 32
  num_threads: 16

# ── Hardware ───────────────────────────────────────────────────────
hardware:
  # "auto"  → detect at runtime (torch.cuda.is_available())
  # "gpu"   → force GPU (will error if none found)
  # "cpu"   → force CPU (slower but always works)
  device: "auto"

  # Number of CPU threads for PyTorch / OpenMP / MKL
  num_cpu_threads: 8

  # GPU index to use when device is "gpu" (ignored on CPU)
  cuda_device_index: 0

# ── RAG / Retrieval ────────────────────────────────────────────────
rag:
  # Number of documents returned by the retriever
  top_k: 5

  # Weight balance between BM25 and vector search (0.0 = BM25 only, 1.0 = vector only)
  hybrid_alpha: 0.5

  # Chunk size and overlap for document splitting
  chunk_size: 512
  chunk_overlap: 64

# ── Logging ────────────────────────────────────────────────────────
logging:
  # DEBUG | INFO | WARNING | ERROR
  level: "INFO"

  # Write logs to file in addition to console (null = console only)
  # Relative to root_dir
  log_file: "log/run.log"

